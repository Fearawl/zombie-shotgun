<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Zombie Shotgun</title>
  <link rel="icon" type="image/svg+xml" href="./assets/zombie-favicon.svg">
  <style>

      align-items: center;

      width: 100vw;
      height: 100vh;
    }

    canvas {
      touch-action: none;
    }

<body>
  <div id="game"></div>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.min.js"></script>
  <script type="module" src="./main.js"></script>

</html>
